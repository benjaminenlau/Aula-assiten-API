spring.application.name=aula-assistent-api
spring.datasource.url=${AULA_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${AULA_DB_USER:postgres}
spring.datasource.password=${AULA_DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
